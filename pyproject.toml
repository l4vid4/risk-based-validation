[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-based-validation"
version = "0.1.0"
description = "Explainable, conservative test selection and exact-state evidence reuse for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["agent-skills", "codex", "regression-testing", "test-selection"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.urls]
Homepage = "https://github.com/l4vid4/risk-based-validation"
Repository = "https://github.com/l4vid4/risk-based-validation"
Issues = "https://github.com/l4vid4/risk-based-validation/issues"
Documentation = "https://github.com/l4vid4/risk-based-validation#readme"

[project.scripts]
rbv = "rbv.cli:main"

[tool.setuptools.packages.find]
where = ["skills/risk-based-validation/scripts"]
include = ["rbv*"]
