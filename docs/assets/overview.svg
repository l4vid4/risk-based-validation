<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">risk-based-validation — Run what matters. Know when to stop.</title>
  <desc id="desc">A skill and local CLI for coding agents. Review changes and impact, enforce risk gates, select useful checks, reuse valid evidence, and explain when verification is complete.</desc>
  <rect width="1200" height="440" rx="20" fill="#0c1424"/>
  <path d="M0 345H1200M930 0V440" stroke="#1c2b43" stroke-width="1"/>
  <circle cx="1080" cy="77" r="148" fill="#13283a"/>
  <circle cx="1080" cy="77" r="102" fill="none" stroke="#315465"/>
  <circle cx="1080" cy="77" r="56" fill="none" stroke="#5ad5b3" stroke-width="2"/>
  <path d="M1060 77l14 14 26-30" fill="none" stroke="#78e6c6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="52" font-size="19" font-weight="700" letter-spacing="2" fill="#78e6c6">RISK-BASED-VALIDATION</text>
    <text x="48" y="114" font-size="47" font-weight="700" fill="#f4f7fc">Run what matters.</text>
    <text x="48" y="170" font-size="47" font-weight="700" fill="#f4f7fc">Know when to stop.</text>
    <text x="50" y="207" font-size="20" fill="#b2bfd1">Proportionate verification for Codex and other coding agents.</text>
    <g transform="translate(48 247)">
      <rect width="185" height="68" rx="10" fill="#17263d" stroke="#30435e"/>
      <text x="18" y="28" font-size="17" font-weight="700" fill="#eef4ff">01  Changes</text>
      <text x="18" y="51" font-size="14" fill="#b2bfd1">Diff + input identity</text>
      <path d="M195 34h27m-7-7 7 7-7 7" fill="none" stroke="#78e6c6" stroke-width="2"/>
      <g transform="translate(235)">
        <rect width="185" height="68" rx="10" fill="#17263d" stroke="#30435e"/>
        <text x="18" y="28" font-size="17" font-weight="700" fill="#eef4ff">02  Impact</text>
        <text x="18" y="51" font-size="14" fill="#b2bfd1">Reverse dependencies</text>
        <path d="M195 34h27m-7-7 7 7-7 7" fill="none" stroke="#78e6c6" stroke-width="2"/>
      </g>
      <g transform="translate(470)">
        <rect width="185" height="68" rx="10" fill="#252a39" stroke="#c99c55"/>
        <text x="18" y="28" font-size="17" font-weight="700" fill="#f3d6a4">03  Risk gates</text>
        <text x="18" y="51" font-size="14" fill="#c9c8cd">Required domain checks</text>
        <path d="M195 34h27m-7-7 7 7-7 7" fill="none" stroke="#78e6c6" stroke-width="2"/>
      </g>
      <g transform="translate(705)">
        <rect width="185" height="68" rx="10" fill="#16352f" stroke="#4aa58c"/>
        <text x="18" y="28" font-size="17" font-weight="700" fill="#a7f0d9">04  Evidence</text>
        <text x="18" y="51" font-size="14" fill="#bdd4cd">Useful checks + valid reuse</text>
        <path d="M195 34h27m-7-7 7 7-7 7" fill="none" stroke="#78e6c6" stroke-width="2"/>
      </g>
      <g transform="translate(940)">
        <rect width="160" height="68" rx="10" fill="#17263d" stroke="#30435e"/>
        <text x="18" y="28" font-size="17" font-weight="700" fill="#eef4ff">05  Report</text>
        <text x="18" y="51" font-size="14" fill="#b2bfd1">Explain the decision</text>
      </g>
    </g>
    <text x="48" y="387" font-size="18" fill="#c8d4e5">Unknown impact → broader checks.</text>
    <text x="445" y="387" font-size="18" fill="#c8d4e5">High risk → fresh evidence.</text>
    <text x="821" y="387" font-size="18" fill="#78e6c6">No blind retry loops.</text>
    <text x="48" y="419" font-size="14" fill="#8294ae">MIT · Python standard library + Git · Local execution · Reproducible benchmarks</text>
  </g>
